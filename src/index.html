<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ZenBlog</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- DEĞİŞTİ: ZenBlog yaprak ikonu -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- YENİ: Manrope yazı tipi (Türkçe karakterleri destekliyor) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- DEĞİŞTİ: Manrope (arayüz) + Lora (blog yazılarının okuma fontu) -->
    <!-- DEĞİŞTİ: Manrope (arayüz) + Lora (yazılar) + Pixelify Sans ve Press Start 2P (yazar paneli piksel fontları) -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet"><!-- Google ile giriş kütüphanesi (Google Identity Services) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Cloudflare Turnstile (bot koruması).
       render=explicit: kutucuğu sayfa açılınca kendisi çizmesin; biz component'ten çizeceğiz -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
