<!-- =====================================================================
     E-POSTA DOĞRULAMA (çerçeve: app-auth-shell)
     ===================================================================== -->
<app-auth-shell heading="E-postanı doğrula" icon="pi pi-envelope">

  <!-- Bilgi metni: e-posta biliniyorsa adresi göster -->
  <p class="zb-auth-lead" *ngIf="emailLocked">
    <strong>{{ email }}</strong> adresine 6 haneli bir doğrulama kodu gönderdik.
    Gelen kutunu, gerekirse spam klasörünü kontrol et.
  </p>
  <p class="zb-auth-lead" *ngIf="!emailLocked">
    Kayıt olurken kullandığın e-posta adresini ve sana gelen 6 haneli kodu gir.
  </p>

  <div class="zb-auth-alert is-error" role="alert" *ngIf="errorMessage">
    <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <form #verifyForm="ngForm" (ngSubmit)="confirm()" novalidate class="zb-auth-form">

    <!-- E-POSTA: sadece adresten gelmediyse sorulur -->
    <div class="zb-field" *ngIf="!emailLocked">
      <label for="email" class="zb-label">E-posta</label>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-envelope" />
        <input pInputText type="email" id="email" name="email" autocomplete="email" placeholder="ornek@mail.com"
               [(ngModel)]="email" required email>
      </p-iconfield>
    </div>

    <!-- 6 KUTULU KOD
         p-inputotp: her rakam ayrı kutuda; yazdıkça bir sonraki kutuya geçer.
         [integerOnly]: sadece rakam kabul eder -->
    <div class="zb-field">
      <label class="zb-label zb-center">Doğrulama kodu</label>
      <p-inputotp name="code" [(ngModel)]="code" [length]="6" [integerOnly]="true" />
    </div>

    <p-button type="submit" class="zb-submit" styleClass="zb-submit-btn"
              [label]="isLoading ? 'Doğrulanıyor...' : 'Hesabımı doğrula'"
              icon="pi pi-check" iconPos="right" [loading]="isLoading"
              [disabled]="code?.length !== 6 || !email || isLoading" />
  </form>

  <!-- TEKRAR GÖNDER: geri sayım bitene kadar pasif -->
  <p class="zb-resend">
    Kod gelmedi mi?
    <button type="button" class="zb-link-btn" (click)="resend()" [disabled]="countdown > 0 || isResending || !email">
      {{ countdown > 0 ? 'Tekrar gönder (' + countdown + ' sn)' : (isResending ? 'Gönderiliyor...' : 'Tekrar gönder') }}
    </button>
  </p>

  <p class="zb-auth-switch">
    <a routerLink="/login">Giriş sayfasına dön</a>
  </p>

</app-auth-shell>
