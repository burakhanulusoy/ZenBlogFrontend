<div class="auth-page d-flex align-items-center justify-content-center px-3">

  <div class="card auth-card border-0 shadow-lg">
    <div class="card-body p-4 p-md-5">

      <!-- LOGO VE BAŞLIK -->
      <div class="text-center mb-4">
        <div class="auth-logo d-inline-flex align-items-center justify-content-center rounded-circle text-white mb-3">
          <i class="fa fa-envelope-open-o fa-2x" aria-hidden="true"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">E-postanı Doğrula</h1>
        <p class="text-muted mb-0">
          <span *ngIf="email"><strong>{{ email }}</strong> adresine gönderdiğimiz</span>
          <span *ngIf="!email">E-postana gönderdiğimiz</span>
          6 haneli kodu gir.
        </p>
      </div>

      <!-- API HATASI -->
      <div class="alert alert-danger d-flex align-items-start py-2" role="alert" *ngIf="errorMessage">
        <i class="fa fa-exclamation-circle me-2 mt-1" aria-hidden="true"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <form #verifyForm="ngForm" (ngSubmit)="confirm()" novalidate>

        <!-- E-POSTA: adresten geldiyse dolu; kullanıcı doğrudan sayfaya girdiyse kendisi yazar -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">E-posta</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa fa-envelope-o" aria-hidden="true"></i></span>
            <input type="email" id="email" name="email" class="form-control" placeholder="ornek@mail.com"
                   [(ngModel)]="email" #emailInput="ngModel" required email
                   [class.is-invalid]="emailInput.invalid && emailInput.touched">
          </div>
          <div class="text-danger small mt-1" *ngIf="emailInput.invalid && emailInput.touched">
            Geçerli bir e-posta adresi giriniz.
          </div>
        </div>

        <!-- DOĞRULAMA KODU
             pattern: tam olarak 6 rakam
             inputmode="numeric": telefonda sayı klavyesi açılsın
             autocomplete="one-time-code": telefonda SMS/e-postadaki kodu otomatik önersin -->
        <div class="mb-4">
          <label for="code" class="form-label fw-semibold">Doğrulama Kodu</label>
          <input type="text" id="code" name="code" class="form-control code-input text-center"
                 placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                 [(ngModel)]="code" #codeInput="ngModel" required pattern="[0-9]{6}"
                 [class.is-invalid]="codeInput.invalid && codeInput.touched">
          <div class="text-danger small mt-1" *ngIf="codeInput.invalid && codeInput.touched">
            Kod 6 haneli bir sayı olmalıdır.
          </div>
        </div>

        <!-- DOĞRULA BUTONU -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
                [disabled]="verifyForm.invalid || isLoading">
          <span *ngIf="!isLoading"><i class="fa fa-check me-1" aria-hidden="true"></i> Doğrula</span>
          <span *ngIf="isLoading"><span class="spinner-border spinner-border-sm me-2"></span> Doğrulanıyor...</span>
        </button>

      </form>

      <!-- KODU TEKRAR GÖNDER: geri sayım bitene kadar ya da e-posta geçersizse pasif -->
      <div class="text-center mt-4">
        <p class="text-muted small mb-2">Kod gelmedi mi? Spam klasörünü de kontrol et.</p>

        <button type="button" class="btn btn-link text-decoration-none fw-semibold p-0"
                (click)="resend()"
                [disabled]="countdown > 0 || isResending || emailInput.invalid">
          <span *ngIf="countdown > 0">Kodu tekrar gönder ({{ countdown }} sn)</span>
          <span *ngIf="countdown <= 0 && !isResending"><i class="fa fa-refresh me-1" aria-hidden="true"></i> Kodu tekrar gönder</span>
          <span *ngIf="isResending"><span class="spinner-border spinner-border-sm me-2"></span> Gönderiliyor...</span>
        </button>
      </div>

      <!-- ALT BAĞLANTI -->
      <p class="text-center mt-4 mb-0">
        <a routerLink="/login" class="small text-muted text-decoration-none">
          <i class="fa fa-arrow-left me-1" aria-hidden="true"></i> Giriş sayfasına dön
        </a>
      </p>

    </div>
  </div>

</div>
