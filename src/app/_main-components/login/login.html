<!-- =====================================================================
     GİRİŞ SAYFASI (çerçeve: app-auth-shell)
     ===================================================================== -->
<app-auth-shell heading="Tekrar hoş geldin" subheading="Hesabına giriş yap ve yazmaya kaldığın yerden devam et.">

  <!-- Doğrulamadan / şifre sıfırlamadan gelince yeşil bilgi -->
  <div class="zb-auth-alert is-success" role="status" *ngIf="successMessage">
    <i class="pi pi-check-circle" aria-hidden="true"></i>
    <span>{{ successMessage }}</span>
  </div>

  <!-- API hatası -->
  <div class="zb-auth-alert is-error" role="alert" *ngIf="errorMessage">
    <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- GOOGLE: buton bu kutunun içine çizilir (login.ts → renderGoogleButton) -->
  <div class="zb-google">
    <div #googleButton></div>
  </div>

  <div class="zb-divider">ya da e-postayla</div>

  <form #loginForm="ngForm" (ngSubmit)="login()" novalidate class="zb-auth-form">

    <!-- E-POSTA -->
    <div class="zb-field">
      <label for="email" class="zb-label">E-posta</label>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-envelope" />
        <input pInputText type="email" id="email" name="email" autocomplete="email"
               placeholder="ornek@mail.com"
               [(ngModel)]="loginDto.email" #email="ngModel" required email
               [class.zb-invalid]="email.invalid && email.touched">
      </p-iconfield>
      <small class="zb-error" *ngIf="email.invalid && email.touched">
        {{ email.errors?.['required'] ? 'E-posta zorunludur.' : 'Geçerli bir e-posta adresi gir.' }}
      </small>
    </div>

    <!-- ŞİFRE
         p-password: [toggleMask] → göz ikonuyla göster/gizle, [feedback]="false" → güç göstergesi kapalı -->
    <div class="zb-field">
      <div class="zb-label-row">
        <label for="password" class="zb-label">Şifre</label>
        <a routerLink="/forgot-password" [queryParams]="{ email: loginDto.email }" class="zb-link-sm">Şifremi unuttum</a>
      </div>
      <p-password inputId="password" name="password" placeholder="Şifreni gir" autocomplete="current-password"
                  [(ngModel)]="loginDto.password" #password="ngModel" required
                  [toggleMask]="true" [feedback]="false"
                  [class.zb-invalid]="password.invalid && password.touched" />
      <small class="zb-error" *ngIf="password.invalid && password.touched">Şifre zorunludur.</small>
    </div>

    <!-- TURNSTILE: doğrulanınca token gelir, buton aktifleşir -->
    <div class="zb-turnstile">
      <app-turnstile (tokenChange)="turnstileToken = $event"></app-turnstile>
    </div>

    <!-- GİRİŞ BUTONU: [loading] → istek sürerken dönen ikon -->
    <p-button type="submit" class="zb-submit" styleClass="zb-submit-btn"
              [label]="isLoading ? 'Giriş yapılıyor...' : 'Giriş yap'"
              icon="pi pi-arrow-right" iconPos="right" [loading]="isLoading"
              [disabled]="loginForm.invalid || isLoading || !turnstileToken" />

  </form>

  <p class="zb-auth-switch">
    Hesabın yok mu? <a routerLink="/register">Ücretsiz kayıt ol</a>
  </p>

</app-auth-shell>
