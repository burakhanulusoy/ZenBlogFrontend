<!-- Tam ekran, ortalanmış giriş sayfası -->
<div class="login-page d-flex align-items-center justify-content-center px-3">

  <div class="card login-card border-0 shadow-lg">
    <div class="card-body p-4 p-md-5">

      <!-- LOGO VE BAŞLIK -->
      <div class="text-center mb-4">
        <div class="login-logo d-inline-flex align-items-center justify-content-center rounded-circle text-white mb-3">
          <i class="fa fa-pencil-square-o fa-2x" aria-hidden="true"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">ZenBlog'a Hoş Geldin</h1>
        <p class="text-muted mb-0">Devam etmek için hesabına giriş yap</p>
      </div>

      <!-- Doğrulamadan / şifre sıfırlamadan gelince yeşil bilgi mesajı -->
      <div class="alert alert-success d-flex align-items-start py-2" role="alert" *ngIf="successMessage">
        <i class="fa fa-check-circle me-2 mt-1" aria-hidden="true"></i>
        <div>{{ successMessage }}</div>
      </div>

      <!-- API HATASI -->
      <div class="alert alert-danger d-flex align-items-start py-2" role="alert" *ngIf="errorMessage">
        <i class="fa fa-exclamation-circle me-2 mt-1" aria-hidden="true"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>

        <!-- E-POSTA -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">E-posta</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa fa-envelope-o" aria-hidden="true"></i></span>
            <input type="email" id="email" name="email" class="form-control"
                   placeholder="ornek@mail.com"
                   [(ngModel)]="loginDto.email" #email="ngModel"
                   required email
                   [class.is-invalid]="email.invalid && email.touched">
          </div>
          <div class="text-danger small mt-1" *ngIf="email.invalid && email.touched">
            <span *ngIf="email.errors?.['required']">E-posta zorunludur.</span>
            <span *ngIf="email.errors?.['email']">Geçerli bir e-posta adresi giriniz.</span>
          </div>
        </div>

        <!-- ŞİFRE -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label fw-semibold mb-2">Şifre</label>
            <a routerLink="/forgot-password" [queryParams]="{ email: loginDto.email }"
               class="small text-decoration-none mb-2">Şifremi unuttum?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa fa-lock" aria-hidden="true"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" class="form-control"
                   placeholder="Şifreni gir"
                   [(ngModel)]="loginDto.password" #password="ngModel"
                   required
                   [class.is-invalid]="password.invalid && password.touched">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword"
                    [title]="showPassword ? 'Şifreyi gizle' : 'Şifreyi göster'">
              <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
            </button>
          </div>
          <div class="text-danger small mt-1" *ngIf="password.invalid && password.touched">
            Şifre zorunludur.
          </div>
        </div>

        <!-- YENİ: TURNSTILE KUTUCUĞU
             (tokenChange)="turnstileToken = $event": kutucuk token verince (ya da süresi dolunca null)
             $event, component'in emit ettiği değer -->
        <div class="d-flex justify-content-center mb-3">
          <app-turnstile (tokenChange)="turnstileToken = $event"></app-turnstile>
        </div>

        <!-- GİRİŞ BUTONU
             DEĞİŞTİ: !turnstileToken → kutucuk doğrulanmadan buton pasif -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
                [disabled]="loginForm.invalid || isLoading || !turnstileToken">
          <span *ngIf="!isLoading"><i class="fa fa-sign-in me-1" aria-hidden="true"></i> Giriş Yap</span>
          <span *ngIf="isLoading"><span class="spinner-border spinner-border-sm me-2"></span> Giriş yapılıyor...</span>
        </button>

      </form>

      <!-- "veya" ayıracı -->
      <div class="divider my-4"><span>veya</span></div>

      <!-- Google butonu bu kutunun içine çizilir (login.ts → renderGoogleButton) -->
      <div #googleButton class="d-flex justify-content-center"></div>

      <!-- ALT BAĞLANTILAR -->
      <p class="text-center text-muted mt-4 mb-2">
        Hesabın yok mu? <a routerLink="/register" class="fw-semibold text-decoration-none">Kayıt ol</a>
      </p>
      <p class="text-center mb-0">
        <a routerLink="/" class="small text-muted text-decoration-none">
          <i class="fa fa-arrow-left me-1" aria-hidden="true"></i> Ana sayfaya dön
        </a>
      </p>

    </div>
  </div>

</div>
