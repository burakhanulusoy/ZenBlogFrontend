<!-- [class.is-collapsed]: menü daraltılmışsa bütün çerçeve buna göre ayarlanır -->
<div class="zb-shell" [class.is-collapsed]="collapsed">

  <!-- SOL MENÜ (masaüstü): şablona "daraltılmış mı" bilgisini veriyoruz -->
  <aside class="zb-sidebar">
    <ng-container *ngTemplateOutlet="sidebarContent; context: { $implicit: collapsed }"></ng-container>
  </aside>

  <!-- SOL MENÜ (mobil): her zaman tam genişlik -->
  <p-drawer [(visible)]="mobileMenuVisible" position="left" [showCloseIcon]="false"
            [style]="{ width: '280px' }" styleClass="zb-drawer">
    <ng-container *ngTemplateOutlet="sidebarContent; context: { $implicit: false }"></ng-container>
  </p-drawer>

  <div class="zb-main">

    <!-- ÜST ÇUBUK -->
    <header class="zb-topbar">
      <div class="zb-topbar-left">
        <button type="button" class="zb-icon-btn" (click)="toggleMenu()"
                [attr.aria-label]="collapsed ? 'Menüyü genişlet' : 'Menüyü daralt'">
          <i class="pi pi-bars" aria-hidden="true"></i>
        </button>

        <div class="zb-crumbs">
          <span class="zb-crumb-root">Yönetim</span>
          <ng-container *ngIf="pageTitle">
            <i class="pi pi-angle-right zb-crumb-sep" aria-hidden="true"></i>
            <span class="zb-crumb-current">{{ pageTitle }}</span>
          </ng-container>
        </div>
      </div>

      <div class="zb-topbar-right">
        <span class="zb-date">
          <i class="pi pi-calendar" aria-hidden="true"></i>
          {{ todayText }}
        </span>


        <a routerLink="/" target="_blank" class="zb-icon-btn" pTooltip="Siteyi görüntüle" tooltipPosition="bottom"
           aria-label="Siteyi görüntüle">
          <i class="pi pi-external-link" aria-hidden="true"></i>
        </a>

        <button type="button" class="zb-user" (click)="userMenu.toggle($event)" aria-haspopup="true">
                    <!-- DEĞİŞTİ: fotoğraf varsa fotoğraf, yoksa baş harfler -->
          <p-avatar *ngIf="imageUrl" [image]="imageUrl" shape="circle" styleClass="zb-avatar" />
          <p-avatar *ngIf="!imageUrl" [label]="initials" shape="circle" styleClass="zb-avatar" />
          <span class="zb-user-text">
            <span class="zb-user-name">{{ fullName || 'Admin' }}</span>
            <span class="zb-user-role">Yönetici</span>
          </span>
          <i class="pi pi-chevron-down zb-user-caret" aria-hidden="true"></i>
        </button>

        <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body">
          <ng-template #start>
            <div class="zb-menu-head">
              <div class="zb-menu-name">{{ fullName || 'Admin' }}</div>
              <div class="zb-menu-email">{{ email }}</div>
            </div>
          </ng-template>
        </p-menu>
      </div>
    </header>

    <main class="zb-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>


<!-- =============================================================
     MENÜ ŞABLONU
     let-isCollapsed: ngTemplateOutlet'in context'indeki $implicit değeri
     (masaüstünde collapsed, mobilde hep false)
     ============================================================= -->
<ng-template #sidebarContent let-isCollapsed>
  <div class="zb-sidebar-inner" [class.is-collapsed]="isCollapsed">

    <!-- LOGO: daraltılınca sadece yaprak -->
    <a routerLink="/admin" class="zb-brand" aria-label="ZenBlog yönetim paneli">
      <img *ngIf="!isCollapsed" src="zenblog-logo.png" alt="ZenBlog" class="zb-logo">
      <img *ngIf="isCollapsed" src="zenblog-icon.png" alt="ZenBlog" class="zb-logo-icon">
      <span class="zb-brand-tag" *ngIf="!isCollapsed">Yönetim</span>
    </a>

    <nav class="zb-nav" aria-label="Yönetim menüsü">

      <div class="zb-nav-group" *ngFor="let group of menuGroups">
        <p class="zb-nav-title">{{ group.title }}</p>
        <!-- Daraltılmışken yazı gizli → adı baloncukta (pTooltip) göster -->
        <a *ngFor="let item of group.items" class="zb-nav-link"
           [routerLink]="item.link" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: !!item.exact }"
           [pTooltip]="item.label" tooltipPosition="right" [tooltipDisabled]="!isCollapsed">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span class="zb-nav-label">{{ item.label }}</span>
        </a>
      </div>

      <div class="zb-nav-group zb-nav-personal">
        <p class="zb-nav-title">{{ personalGroup.title }}</p>
        <a *ngFor="let item of personalGroup.items" class="zb-nav-link"
           [routerLink]="item.link" routerLinkActive="is-active"
           [pTooltip]="item.label" tooltipPosition="right" [tooltipDisabled]="!isCollapsed">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span class="zb-nav-label">{{ item.label }}</span>
        </a>
      </div>

    </nav>

    <!-- ALT: oturum bilgisi -->
    <div class="zb-sidebar-foot">
      <span class="zb-status-dot" aria-hidden="true"></span>
      <span class="zb-nav-label">Oturum açık · Yönetici</span>
    </div>

  </div>
</ng-template>
