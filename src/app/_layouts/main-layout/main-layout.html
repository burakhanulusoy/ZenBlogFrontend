<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
  <div class="container">

    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="fa fa-pencil-square-o text-primary me-1" aria-hidden="true"></i> ZenBlog
    </a>

    <!-- Mobilde menüyü açıp kapatan buton (Bootstrap 5: data-bs-...) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Menüyü aç/kapat">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <!-- exact: true → sadece tam olarak "/" adresindeyken "aktif" görünsün -->
          <a class="nav-link" routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">Ana Sayfa</a>
        </li>
      </ul>

      <div class="d-flex gap-2">

        <!-- Giriş yapılmamışsa: Giriş Yap + Kayıt Ol
             else loggedInMenu: giriş yapılmışsa aşağıdaki ng-template gösterilir -->
        <ng-container *ngIf="!authService.loggedIn(); else loggedInMenu">
          <a routerLink="/login" class="btn btn-outline-primary">
            <i class="fa fa-sign-in me-1" aria-hidden="true"></i> Giriş Yap
          </a>
          <a routerLink="/register" class="btn btn-primary">
            <i class="fa fa-user-plus me-1" aria-hidden="true"></i> Kayıt Ol
          </a>
        </ng-container>

        <!-- Giriş yapılmışsa: Panel (sadece Admin) + Çıkış -->
        <ng-template #loggedInMenu>
          <!-- DEĞİŞTİ: *ngIf ile sadece Admin'e gösteriliyor -->
          <a routerLink="/admin" class="btn btn-outline-primary" *ngIf="authService.isAdmin()">
            <i class="fa fa-tachometer me-1" aria-hidden="true"></i> Panel
          </a>
          <button type="button" class="btn btn-outline-danger" (click)="authService.logout()">
            <i class="fa fa-sign-out me-1" aria-hidden="true"></i> Çıkış
          </button>
        </ng-template>

      </div>
    </div>

  </div>
</nav>

<router-outlet></router-outlet>
