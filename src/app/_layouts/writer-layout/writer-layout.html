<!-- zb-pixel: içerideki her şey piksel temaya geçer (styles.css → PİKSEL TEMA) -->
<div class="px-shell zb-pixel">

  <!-- SOL MENÜ (geniş ekran) -->
  <aside class="px-sidebar">
    <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
  </aside>

  <!-- SOL MENÜ (mobil): soldan açılır -->
  <p-drawer [(visible)]="mobileMenuVisible" position="left" [showCloseIcon]="false"
            [style]="{ width: '280px' }" styleClass="px-drawer">
    <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
  </p-drawer>

  <!-- SAĞ TARAF -->
  <div class="px-main">

    <header class="px-topbar">
      <div class="px-topbar-left">
        <button type="button" class="px-icon-btn px-menu-toggle" (click)="mobileMenuVisible = true" aria-label="Menüyü aç">
          <i class="pi pi-bars" aria-hidden="true"></i>
        </button>

        <!-- Konum: YAZAR ▶ Bloglarım -->
        <div class="px-crumbs">
          <span class="px-crumb-root">Yazar</span>
          <ng-container *ngIf="pageTitle">
            <span class="px-crumb-sep" aria-hidden="true">▶</span>
            <span class="px-crumb-current">{{ pageTitle }}</span>
          </ng-container>
        </div>
      </div>

      <div class="px-topbar-right">
        <a routerLink="/" target="_blank" class="px-site-link">
          <i class="pi pi-external-link" aria-hidden="true"></i>
          <span>Siteyi görüntüle</span>
        </a>

        <button type="button" class="px-user" (click)="userMenu.toggle($event)" aria-haspopup="true">
          <span class="px-avatar">{{ initials }}</span>
          <span class="px-user-text">
            <span class="px-user-name">{{ fullName || 'Yazar' }}</span>
            <span class="px-user-role">Yazar</span>
          </span>
          <i class="pi pi-chevron-down px-user-caret" aria-hidden="true"></i>
        </button>

        <!-- styleClass="zb-pixel-overlay": body'ye eklendiği için piksel görünümü bu sınıfla veriyoruz -->
        <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" styleClass="zb-pixel-overlay">
          <ng-template #start>
            <div class="px-menu-head">
              <div class="px-menu-name">{{ fullName || 'Yazar' }}</div>
              <div class="px-menu-email">{{ email }}</div>
            </div>
          </ng-template>
        </p-menu>
      </div>
    </header>

    <main class="px-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>


<!-- MENÜ ŞABLONU (masaüstü ve mobilde ortak) -->
<ng-template #sidebarContent>
  <div class="px-sidebar-inner">

    <!-- LOGO: yaprak ikonu kare piksel kutuda -->
    <a routerLink="/writer" class="px-brand" aria-label="ZenBlog yazar paneli">
      <span class="px-brand-tile">
        <img src="zenblog-icon.png" alt="">
      </span>
      <span class="px-brand-text">
        <span class="px-brand-name">ZenBlog</span>
        <span class="px-brand-tag">Yazar</span>
      </span>
    </a>

    <nav class="px-nav" aria-label="Yazar menüsü">
      <div class="px-nav-group" *ngFor="let group of menuGroups">
        <p class="px-nav-title">{{ group.title }}</p>
        <a *ngFor="let item of group.items" class="px-nav-link"
           [routerLink]="item.link" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: !!item.exact }">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <!-- ALTTAKİ ÇAĞRI KARTI: yazmaya teşvik -->
    <div class="px-cta">
      <p class="px-cta-title">Yeni hikâye?</p>
      <p class="px-cta-text">Aklındakini yazıya dök, ZenBlog'da yayınla.</p>
      <a routerLink="/writer/new-blog" class="px-cta-btn">
        <i class="pi pi-plus" aria-hidden="true"></i> Yazmaya başla
      </a>
    </div>

  </div>
</ng-template>
