<div class="admin-wrapper d-flex">

  <!-- SOL MENÜ (admin paneliyle aynı yapı; id'si farklı) -->
  <aside class="offcanvas-lg offcanvas-start admin-sidebar" tabindex="-1" id="writerSidebar" aria-labelledby="writerSidebarLabel">

    <div class="sidebar-inner d-flex flex-column w-100 p-3">

      <!-- LOGO + (mobilde) kapatma butonu -->
      <div class="d-flex align-items-center justify-content-between mb-4 px-2">
        <a routerLink="/writer" class="d-flex align-items-center text-white text-decoration-none" id="writerSidebarLabel">
          <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-3 me-2">
            <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
          </span>
          <span class="fs-5 fw-bold">ZenBlog</span>
          <!-- DEĞİŞTİ: düz yeşil rozet (koyu arka planda yazı görünsün) -->
          <span class="badge bg-success ms-2 small">Yazar</span>
        </a>
        <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                data-bs-target="#writerSidebar" aria-label="Menüyü kapat"></button>
      </div>

      <!-- MENÜ: yazar menüsündeki bütün bağlantılar /writer/... ile başlar -->
      <nav class="flex-grow-1 overflow-auto">

        <!-- GENEL -->
        <p class="menu-title">Genel</p>
        <ul class="nav flex-column mb-3">
          <li class="nav-item">
            <a class="nav-link" routerLink="/writer" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              <i class="fa fa-tachometer" aria-hidden="true"></i> Genel Bakış
            </a>
          </li>
        </ul>

        <!-- YAZILARIM: yazarın kendi blogları (admin'deki "Bana Özel" ile aynı ortak sayfalar) -->
        <p class="menu-title">Yazılarım</p>
        <ul class="nav flex-column mb-3">
          <li class="nav-item">
            <a class="nav-link" routerLink="/writer/my-blogs" routerLinkActive="active">
              <i class="fa fa-file-text-o" aria-hidden="true"></i> Bloglarım
            </a>
          </li>
          <li class="nav-item">
            <span class="nav-link disabled">
              <i class="fa fa-plus-square-o" aria-hidden="true"></i> Yeni Blog Yaz
              <span class="badge soon ms-auto">Yakında</span>
            </span>
          </li>
        </ul>

        <!-- YORUMLAR: yazarın kendi yorumları ve bloglarına gelenler -->
        <p class="menu-title">Yorumlar</p>
        <ul class="nav flex-column">
          <li class="nav-item">
            <span class="nav-link disabled">
              <i class="fa fa-comment-o" aria-hidden="true"></i> Yorumlarım
              <span class="badge soon ms-auto">Yakında</span>
            </span>
          </li>
          <li class="nav-item">
            <span class="nav-link disabled">
              <i class="fa fa-inbox" aria-hidden="true"></i> Bloglarıma Gelen Yorumlar
              <span class="badge soon ms-auto">Yakında</span>
            </span>
          </li>
        </ul>

      </nav>

      <!-- KULLANICI KARTI -->
      <div class="user-card d-flex align-items-center mt-3 p-2 rounded-3">
        <span class="avatar d-inline-flex align-items-center justify-content-center rounded-circle me-2">
          {{ initials || 'Y' }}
        </span>
        <div class="flex-grow-1 overflow-hidden">
          <div class="fw-semibold text-white text-truncate">{{ fullName || 'Yazar' }}</div>
          <div class="small text-white-50">Yazar</div>
        </div>
        <button type="button" class="btn btn-sm btn-link text-white-50 logout-btn" (click)="authService.logout()" title="Çıkış yap">
          <i class="fa fa-sign-out fa-lg" aria-hidden="true"></i>
        </button>
      </div>

    </div>
  </aside>

  <!-- SAĞ TARAF -->
  <div class="admin-main flex-grow-1 d-flex flex-column">

    <header class="admin-topbar d-flex align-items-center justify-content-between px-3 px-md-4">
      <div class="d-flex align-items-center">
        <button class="btn btn-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#writerSidebar" aria-controls="writerSidebar" aria-label="Menüyü aç">
          <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <span class="fw-semibold text-muted d-none d-sm-inline">Yazar Paneli</span>
      </div>

      <div class="d-flex align-items-center gap-3">
        <a routerLink="/" target="_blank" class="btn btn-sm btn-outline-secondary">
          <i class="fa fa-external-link me-1" aria-hidden="true"></i> Siteyi Görüntüle
        </a>
        <span class="text-muted small d-none d-md-inline">
          <i class="fa fa-user-circle-o me-1" aria-hidden="true"></i>{{ fullName }}
        </span>
      </div>
    </header>

    <main class="flex-grow-1 p-3 p-md-4">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
