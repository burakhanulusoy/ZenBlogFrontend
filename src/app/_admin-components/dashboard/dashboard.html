<!-- KARŞILAMA -->
<div class="welcome-card card border-0 shadow-sm mb-4 text-white">
  <div class="card-body p-4">
    <h1 class="h4 fw-bold mb-1">{{ greeting }}, {{ fullName || 'Admin' }} 👋</h1>
    <p class="mb-0 opacity-75">ZenBlog yönetim paneline hoş geldin. Buradan sitenin tüm içeriğini yönetebilirsin.</p>
  </div>
</div>

<!-- İSTATİSTİK KARTLARI -->
<div class="row g-3 mb-4">

  <div class="col-sm-6 col-xl-3">
    <div class="card stat-card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center">
        <span class="stat-icon bg-primary bg-opacity-10 text-primary me-3"><i class="fa fa-tags" aria-hidden="true"></i></span>
        <div>
          <div class="text-muted small">Kategoriler</div>
          <!-- Yüklenene kadar küçük dönen ikon -->
          <div class="h4 fw-bold mb-0" *ngIf="categoryCount !== null">{{ categoryCount }}</div>
          <div class="spinner-border spinner-border-sm text-primary" *ngIf="categoryCount === null"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card stat-card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center">
        <span class="stat-icon bg-success bg-opacity-10 text-success me-3"><i class="fa fa-newspaper-o" aria-hidden="true"></i></span>
        <div>
          <div class="text-muted small">Bloglar</div>
          <div class="h4 fw-bold mb-0 text-muted">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card stat-card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center">
        <span class="stat-icon bg-warning bg-opacity-10 text-warning me-3"><i class="fa fa-comments-o" aria-hidden="true"></i></span>
        <div>
          <div class="text-muted small">Yorumlar</div>
          <div class="h4 fw-bold mb-0 text-muted">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl-3">
    <div class="card stat-card border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-center">
        <span class="stat-icon bg-danger bg-opacity-10 text-danger me-3"><i class="fa fa-envelope-o" aria-hidden="true"></i></span>
        <div>
          <div class="text-muted small">Okunmamış Mesajlar</div>
          <div class="h4 fw-bold mb-0 text-muted">—</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- HIZLI İŞLEMLER -->
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white py-3">
    <h2 class="h6 fw-bold mb-0"><i class="fa fa-bolt text-warning me-2" aria-hidden="true"></i>Hızlı İşlemler</h2>
  </div>
  <div class="card-body d-flex flex-wrap gap-2">
    <a routerLink="/admin/category" class="btn btn-outline-primary">
      <i class="fa fa-tags me-1" aria-hidden="true"></i> Kategorileri Yönet
    </a>
    <button class="btn btn-outline-secondary" disabled>
      <i class="fa fa-plus me-1" aria-hidden="true"></i> Yeni Blog (yakında)
    </button>
    <button class="btn btn-outline-secondary" disabled>
      <i class="fa fa-envelope-o me-1" aria-hidden="true"></i> Mesajlar (yakında)
    </button>
  </div>
</div>
