<!-- =====================================================================
     GENEL BAKIŞ: yapım aşamasında
     ===================================================================== -->
<section class="zb-soon">
  <img src="zenblog-icon.png" class="zb-soon-mark" alt="" aria-hidden="true">

  <span class="zb-soon-badge">
    <i class="pi pi-wrench" aria-hidden="true"></i> Yapım aşamasında
  </span>

  <h1 class="zb-soon-title">{{ greeting }}, {{ firstName }}</h1>
  <p class="zb-soon-text">
    Genel bakış sayfası hazırlanıyor. Yakında burada blog istatistiklerini,
    aylık yayın grafiğini ve son hareketleri göreceksin.
  </p>

  <!-- Şimdilik kullanılabilen sayfalara kısayollar -->
  <div class="zb-soon-links">
    <a routerLink="/admin/blogs" class="zb-soon-link">
      <span class="zb-soon-icon"><i class="pi pi-book" aria-hidden="true"></i></span>
      <span>
        <strong>Tüm bloglar</strong>
        <small>Sitedeki yazıları incele</small>
      </span>
    </a>
    <a routerLink="/admin/category" class="zb-soon-link">
      <span class="zb-soon-icon"><i class="pi pi-tags" aria-hidden="true"></i></span>
      <span>
        <strong>Kategoriler</strong>
        <small>Kategorileri yönet</small>
      </span>
    </a>
    <a routerLink="/admin/my-blogs" class="zb-soon-link">
      <span class="zb-soon-icon"><i class="pi pi-file-edit" aria-hidden="true"></i></span>
      <span>
        <strong>Bloglarım</strong>
        <small>Kendi yazıların</small>
      </span>
    </a>
  </div>
</section>
